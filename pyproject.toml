[project]
name = "tiendanube-mcp"
version = "0.1.0"
description = "MCP server para administrar una tienda de Tiendanube (Nuvemshop)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "Pillow>=10.0.0",
    "pillow-heif>=0.15.0",
]

[project.scripts]
tiendanube-mcp = "tiendanube_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiendanube_mcp"]
